version: "3.9"
services:
  c2a-lap:
    build: .
    container_name: c2a-lap-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=change-me-production
      - JWT_EXPIRES_IN=8h
      - CORS_ORIGIN=http://localhost:5000
    volumes:
      - ./server/src/data:/app/server/src/data
      - ./server/uploads:/app/server/uploads
